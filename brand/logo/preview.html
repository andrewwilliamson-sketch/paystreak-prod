<!doctype html><html><head><meta charset="utf-8"><title>Paystreak Data logos</title>
<style>
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#e9e5dc;color:#1B1915}

.row{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cell{padding:36px 32px;display:flex;align-items:center;gap:28px;min-height:120px}
.l{background:#F6F3EC}.d{background:#1B1915}
.cell img.lock{height:56px}.cell img.mk{height:96px}
.fav{display:flex;gap:14px;align-items:center}
.fav img{image-rendering:auto}
</style></head><body>
<h2>V1 · Strata — Libre Caslon Text</h2>
<div class="row"><div class="cell l"><img class="lock" src="v1-strata/paystreak-v1-lockup-light.svg"></div><div class="cell d"><img class="lock" src="v1-strata/paystreak-v1-lockup-dark.svg"></div></div>
<div class="row"><div class="cell l"><img class="mk" src="v1-strata/paystreak-v1-mark-light.svg"><img class="lock" src="v1-strata/paystreak-v1-lockup-mono-black.svg"></div><div class="cell d"><img class="mk" src="v1-strata/paystreak-v1-mark-dark.svg"><img class="lock" src="v1-strata/paystreak-v1-lockup-mono-white.svg"></div></div>
